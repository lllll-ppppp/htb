<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风光互济·高效转换 | 风光储一体化互补发电系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#f1f5f9;min-height:100vh;padding:20px}
        .header{text-align:center;margin:30px 0 20px}
        .header h1{font-size:32px;background:linear-gradient(90deg,#38bdf8,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;letter-spacing:2px}
        .header p{font-size:16px;color:#cbd5e1;opacity:0.85}

        /* 模式状态显示 */
        .mode-status{max-width:1400px;margin:0 auto 20px;text-align:center;padding:15px;background:rgba(30,41,59,0.7);border-radius:12px;border:1px solid rgba(148,163,184,0.2);font-size:18px;color:#38bdf8}

        /* 按钮区域 */
        .btn-container{max-width:1000px;margin:0 auto 30px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:10px}
        .ctrl-btn{padding:16px 8px;font-size:16px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,#38bdf8,#10b981);color:#fff;box-shadow:0 4px 12px rgba(56,189,248,0.25)}
        .ctrl-btn:active{transform:scale(0.95);box-shadow:none}

        .data-container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:30px}
        .data-card{background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);border-radius:16px;padding:28px 20px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.2)}
        .card-title{font-size:14px;color:#94a3b8;margin-bottom:12px;letter-spacing:1px}
        .card-value{font-size:36px;font-weight:bold;background:linear-gradient(90deg,#38bdf8,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
        .card-unit{font-size:14px;color:#cbd5e1;opacity:0.8}

        .chart-box{max-width:1400px;margin:0 auto 40px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);border-radius:16px;padding:30px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.2)}
        .chart-title{font-size:18px;margin-bottom:20px;color:#e2e8f0;letter-spacing:1px}
        #dataChart{width:100%!important;height:380px!important}
        .footer{text-align:center;padding:20px;color:#94a3b8;font-size:14px;opacity:0.7}

        @media (max-width:768px){
            .header h1{font-size:24px}
            .card-value{font-size:28px}
            .data-card{padding:22px 16px}
            #dataChart{height:300px!important}
            .btn-container{grid-template-columns:repeat(3,1fr)}
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>风光互济·高效转换</h1>
        <p>风光储一体化互补发电系统 · 实时数据监测与控制平台</p>
    </div>

    <!-- 当前模式显示 -->
    <div class="mode-status">
        当前运行模式：<span id="modeText">模式一：手动控制双轴追光电机</span>
    </div>

    <!-- 5个控制按钮 -->
    <div class="btn-container">
        <button class="ctrl-btn" id="btn1">切换模式</button>
        <button class="ctrl-btn" id="btn2">上</button>
        <button class="ctrl-btn" id="btn3">下</button>
        <button class="ctrl-btn" id="btn4">左</button>
        <button class="ctrl-btn" id="btn5">右</button>
    </div>

    <!-- 数据卡片 -->
    <div class="data-container">
        <div class="data-card"><div class="card-title">光伏阵列电压</div><div class="card-value" id="pvVolt">0.0</div><div class="card-unit">V</div></div>
        <div class="data-card"><div class="card-title">风力发电电压</div><div class="card-value" id="windVolt">0.0</div><div class="card-unit">V</div></div>
        <div class="data-card"><div class="card-title">储能电池电压</div><div class="card-value" id="batVolt">0.0</div><div class="card-unit">V</div></div>
        <div class="data-card"><div class="card-title">超级电容电压</div><div class="card-value" id="scVolt">0.0</div><div class="card-unit">V</div></div>
        <div class="data-card"><div class="card-title">负载输出功率</div><div class="card-value" id="loadPower">0.0</div><div class="card-unit">W</div></div>
        <div class="data-card"><div class="card-title">系统温控温度</div><div class="card-value" id="sysTemp">0.0</div><div class="card-unit">℃</div></div>
    </div>

    <!-- 曲线图 -->
    <div class="chart-box">
        <div class="chart-title">系统运行数据实时趋势曲线</div>
        <canvas id="dataChart"></canvas>
    </div>

    <div class="footer">基于ESP8266无线传输 | 风光储一体化竞赛作品专属监测平台</div>

    <script>
        // 模式定义
        const modeList = [
            "模式一：手动控制双轴追光电机",
            "模式二：手动控制风机左右转",
            "模式三：自动追光、追风模式"
        ];
        let nowMode = 0;

        // 全局数据变量
        let pvData=0.0,windData=0.0,batData=0.0,scData=0.0,powerData=0.0,tempData=0.0;
        const ctx=document.getElementById('dataChart').getContext('2d');
        const timeLabels=[];
        const maxDataPoints=20;

        // ========== 【重要】改成你ESP8266的实际IP ==========
        const ESP8266_IP = "192.168.1.100";
        let ws = null;

        // 初始化图表
        const dataChart=new Chart(ctx,{
            type:'line',
            data:{
                labels:timeLabels,
                datasets:[
                    {label:'光伏电压(V)',data:[],borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,0.2)',borderWidth:2.5,tension:0.3,fill:true},
                    {label:'风机电压(V)',data:[],borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.2)',borderWidth:2.5,tension:0.3,fill:true},
                    {label:'电池电压(V)',data:[],borderColor:'#fbbf24',backgroundColor:'rgba(251,191,36,0.2)',borderWidth:2.5,tension:0.3,fill:true},
                    {label:'输出功率(W)',data:[],borderColor:'#f472b6',backgroundColor:'rgba(244,114,182,0.1)',borderWidth:2.5,tension:0.3,yAxisID:'y1'}
                ]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                plugins:{
                    legend:{position:'top',labels:{color:'#cbd5e1',font:{size:12}}},
                    tooltip:{backgroundColor:'rgba(15,23,42,0.9)',borderColor:'rgba(148,163,184,0.3)'}
                },
                scales:{
                    x:{grid:{color:'rgba(148,163,184,0.1)'},ticks:{color:'#94a3b8'}},
                    y:{grid:{color:'rgba(148,163,184,0.1)'},ticks:{color:'#94a3b8'},title:{display:true,text:'电压(V)',color:'#cbd5e1'}},
                    y1:{position:'right',grid:{display:false},ticks:{color:'#94a3b8'},title:{display:true,text:'功率(W)',color:'#cbd5e1'}}
                }
            }
        });

        // 更新图表
        function updateChart(){
            let now=new Date();
            let timeStr=now.getHours()+":"+now.getMinutes()+":"+now.getSeconds();
            if(timeLabels.length>=maxDataPoints){
                timeLabels.shift();
                dataChart.data.datasets.forEach(item=>item.data.shift());
            }
            timeLabels.push(timeStr);
            dataChart.data.datasets[0].data.push(parseFloat(pvData));
            dataChart.data.datasets[1].data.push(parseFloat(windData));
            dataChart.data.datasets[2].data.push(parseFloat(batData));
            dataChart.data.datasets[3].data.push(parseFloat(powerData));
            dataChart.update();
        }

        // 发送指令到ESP8266
        function sendCmd(cmd){
            if(ws && ws.readyState === WebSocket.OPEN){
                ws.send(cmd);
                console.log("下发指令：",cmd);
            }else{
                console.log("未连接ESP8266，无法发送");
            }
        }

        // 建立WebSocket连接
        function connectWifi(){
            ws = new WebSocket(`ws://${ESP8266_IP}:82`);

            // 连接成功
            ws.onopen = function(){
                console.log("✅ 已成功连接ESP8266 WiFi模块");
            };

            // 接收硬件上传数据 格式：pv,wind,bat,sc,power,temp
            ws.onmessage = function(e){
                let arr = e.data.split(",");
                if(arr.length >= 6){
                    pvData = arr[0];
                    windData = arr[1];
                    batData = arr[2];
                    scData = arr[3];
                    powerData = arr[4];
                    tempData = arr[5];

                    // 刷新页面数值
                    document.getElementById("pvVolt").innerText = pvData;
                    document.getElementById("windVolt").innerText = windData;
                    document.getElementById("batVolt").innerText = batData;
                    document.getElementById("scVolt").innerText = scData;
                    document.getElementById("loadPower").innerText = powerData;
                    document.getElementById("sysTemp").innerText = tempData;

                    updateChart();
                }
            };

            // 连接断开自动重连
            ws.onclose = function(){
                console.log("❌ 与ESP8266断开，3秒后自动重连...");
                setTimeout(connectWifi,3000);
            };

            ws.onerror = function(err){
                console.log("通讯错误：",err);
            };
        }

        // 按钮绑定事件
        document.getElementById("btn1").addEventListener("click",()=>{
            nowMode = (nowMode + 1) % 3;
            document.getElementById("modeText").innerText = modeList[nowMode];
            sendCmd("MODE:"+nowMode);
        });
        document.getElementById("btn2").addEventListener("click",()=>sendCmd("UP"));
        document.getElementById("btn3").addEventListener("click",()=>sendCmd("DOWN"));
        document.getElementById("btn4").addEventListener("click",()=>sendCmd("LEFT"));
        document.getElementById("btn5").addEventListener("click",()=>sendCmd("RIGHT"));

        // 页面加载完自动连接WiFi模块
        window.onload = function(){
            connectWifi();
        };
    </script>
</body>
</html>
